<svg width="620" height="170" viewBox="0 0 620 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;1,300&amp;display=swap');</style>
  </defs>

  <!-- Warm cream background -->
  <rect width="620" height="170" fill="#FAF7F0" rx="0"/>

  <!-- Outer hairlines top + bottom -->
  <line x1="28" y1="16"  x2="592" y2="16"  stroke="#C9A96E" stroke-width="0.65"/>
  <line x1="28" y1="158" x2="592" y2="158" stroke="#C9A96E" stroke-width="0.65"/>

  <!-- Small corner diamond ornaments -->
  <polygon points="28,16  31,13  34,16  31,19"  fill="#C9A96E"/>
  <polygon points="592,16 595,13 598,16 595,19" fill="#C9A96E"/>
  <polygon points="28,158 31,155 34,158 31,161" fill="#C9A96E"/>
  <polygon points="592,158 595,155 598,158 595,161" fill="#C9A96E"/>

  <!-- "THE" flanked by hairlines -->
  <line x1="28"  y1="50" x2="242" y2="50" stroke="#C9A96E" stroke-width="0.55" opacity="0.65"/>
  <text x="310" y="55"
    text-anchor="middle"
    font-family="'Jost','Helvetica Neue',Arial,sans-serif"
    font-size="11" font-weight="300" letter-spacing="12" fill="#C9A96E">THE</text>
  <line x1="378" y1="50" x2="592" y2="50" stroke="#C9A96E" stroke-width="0.55" opacity="0.65"/>

  <!-- Tiny centered 4-pt star between THE and wordmark -->
  <path d="M310,63 C311.5,60 313,58.5 316,57.5 C313,56.5 311.5,55 310,52 C308.5,55 307,56.5 304,57.5 C307,58.5 308.5,60 310,63Z" fill="#C9A96E" opacity="0.7"/>

  <!-- MAIN WORDMARK: ultra-thin, wide tracking -->
  <text x="310" y="103"
    text-anchor="middle"
    font-family="'Jost','Helvetica Neue',Arial,sans-serif"
    font-size="38" font-weight="200" letter-spacing="13" fill="#0D0A07">NAIL ARTISTRY</text>

  <!-- Thin rule below wordmark -->
  <line x1="28" y1="118" x2="592" y2="118" stroke="#C9A96E" stroke-width="0.55" opacity="0.65"/>

  <!-- Tagline: Est. MMXXIV -->
  <text x="310" y="141"
    text-anchor="middle"
    font-family="'Jost','Helvetica Neue',Arial,sans-serif"
    font-size="10" font-weight="300" letter-spacing="9" fill="#C9A96E" opacity="0.9">EST.  MMXXIV</text>
</svg>
