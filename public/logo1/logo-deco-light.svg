<svg width="560" height="200" viewBox="0 0 560 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,600;1,300&amp;display=swap');</style>
  </defs>

  <rect width="560" height="200" fill="#FAF7F0"/>

  <!-- ===== OUTER BORDER ===== -->
  <rect x="12" y="12" width="536" height="176" stroke="#C9A96E" stroke-width="1" fill="none"/>
  <rect x="18" y="18" width="524" height="164" stroke="#C9A96E" stroke-width="0.4" fill="none" opacity="0.5"/>

  <!-- ===== ART DECO CORNER FANS ===== -->
  <!-- All fans radiate from their corner toward center (radius ~58px) -->

  <!-- TOP-LEFT fan at (18,18) -->
  <g transform="translate(18,18)">
    <line x1="0" y1="0" x2="58" y2="0"  stroke="#C9A96E" stroke-width="0.9" opacity="0.75"/>
    <line x1="0" y1="0" x2="55" y2="16" stroke="#C9A96E" stroke-width="0.7" opacity="0.65"/>
    <line x1="0" y1="0" x2="47" y2="31" stroke="#C9A96E" stroke-width="0.6" opacity="0.55"/>
    <line x1="0" y1="0" x2="36" y2="43" stroke="#C9A96E" stroke-width="0.6" opacity="0.5"/>
    <line x1="0" y1="0" x2="22" y2="52" stroke="#C9A96E" stroke-width="0.5" opacity="0.45"/>
    <line x1="0" y1="0" x2="7"  y2="57" stroke="#C9A96E" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="0"  y2="58" stroke="#C9A96E" stroke-width="0.9" opacity="0.75"/>
    <path d="M58,0 A58,58 0 0,1 0,58" stroke="#C9A96E" stroke-width="0.9" fill="none" opacity="0.6"/>
    <path d="M44,0 A44,44 0 0,1 0,44" stroke="#C9A96E" stroke-width="0.5" fill="none" opacity="0.35"/>
  </g>

  <!-- TOP-RIGHT fan at (542,18) — mirror X -->
  <g transform="translate(542,18) scale(-1,1)">
    <line x1="0" y1="0" x2="58" y2="0"  stroke="#C9A96E" stroke-width="0.9" opacity="0.75"/>
    <line x1="0" y1="0" x2="55" y2="16" stroke="#C9A96E" stroke-width="0.7" opacity="0.65"/>
    <line x1="0" y1="0" x2="47" y2="31" stroke="#C9A96E" stroke-width="0.6" opacity="0.55"/>
    <line x1="0" y1="0" x2="36" y2="43" stroke="#C9A96E" stroke-width="0.6" opacity="0.5"/>
    <line x1="0" y1="0" x2="22" y2="52" stroke="#C9A96E" stroke-width="0.5" opacity="0.45"/>
    <line x1="0" y1="0" x2="7"  y2="57" stroke="#C9A96E" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="0"  y2="58" stroke="#C9A96E" stroke-width="0.9" opacity="0.75"/>
    <path d="M58,0 A58,58 0 0,1 0,58" stroke="#C9A96E" stroke-width="0.9" fill="none" opacity="0.6"/>
    <path d="M44,0 A44,44 0 0,1 0,44" stroke="#C9A96E" stroke-width="0.5" fill="none" opacity="0.35"/>
  </g>

  <!-- BOTTOM-LEFT fan at (18,182) — mirror Y -->
  <g transform="translate(18,182) scale(1,-1)">
    <line x1="0" y1="0" x2="58" y2="0"  stroke="#C9A96E" stroke-width="0.9" opacity="0.75"/>
    <line x1="0" y1="0" x2="55" y2="16" stroke="#C9A96E" stroke-width="0.7" opacity="0.65"/>
    <line x1="0" y1="0" x2="47" y2="31" stroke="#C9A96E" stroke-width="0.6" opacity="0.55"/>
    <line x1="0" y1="0" x2="36" y2="43" stroke="#C9A96E" stroke-width="0.6" opacity="0.5"/>
    <line x1="0" y1="0" x2="22" y2="52" stroke="#C9A96E" stroke-width="0.5" opacity="0.45"/>
    <line x1="0" y1="0" x2="7"  y2="57" stroke="#C9A96E" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="0"  y2="58" stroke="#C9A96E" stroke-width="0.9" opacity="0.75"/>
    <path d="M58,0 A58,58 0 0,1 0,58" stroke="#C9A96E" stroke-width="0.9" fill="none" opacity="0.6"/>
    <path d="M44,0 A44,44 0 0,1 0,44" stroke="#C9A96E" stroke-width="0.5" fill="none" opacity="0.35"/>
  </g>

  <!-- BOTTOM-RIGHT fan at (542,182) — mirror both -->
  <g transform="translate(542,182) scale(-1,-1)">
    <line x1="0" y1="0" x2="58" y2="0"  stroke="#C9A96E" stroke-width="0.9" opacity="0.75"/>
    <line x1="0" y1="0" x2="55" y2="16" stroke="#C9A96E" stroke-width="0.7" opacity="0.65"/>
    <line x1="0" y1="0" x2="47" y2="31" stroke="#C9A96E" stroke-width="0.6" opacity="0.55"/>
    <line x1="0" y1="0" x2="36" y2="43" stroke="#C9A96E" stroke-width="0.6" opacity="0.5"/>
    <line x1="0" y1="0" x2="22" y2="52" stroke="#C9A96E" stroke-width="0.5" opacity="0.45"/>
    <line x1="0" y1="0" x2="7"  y2="57" stroke="#C9A96E" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="0"  y2="58" stroke="#C9A96E" stroke-width="0.9" opacity="0.75"/>
    <path d="M58,0 A58,58 0 0,1 0,58" stroke="#C9A96E" stroke-width="0.9" fill="none" opacity="0.6"/>
    <path d="M44,0 A44,44 0 0,1 0,44" stroke="#C9A96E" stroke-width="0.5" fill="none" opacity="0.35"/>
  </g>

  <!-- ===== TOP CENTER ART DECO ORNAMENT ===== -->
  <!-- Diamond above text -->
  <polygon points="280,28 284,22 280,16 276,22" fill="#C9A96E" opacity="0.6"/>
  <!-- Flanking small horizontal lines from center ornament -->
  <line x1="180" y1="28" x2="272" y2="28" stroke="#C9A96E" stroke-width="0.5" opacity="0.4"/>
  <line x1="288" y1="28" x2="380" y2="28" stroke="#C9A96E" stroke-width="0.5" opacity="0.4"/>

  <!-- ===== CONTENT CENTER ===== -->
  <!-- "THE" small label -->
  <text x="280" y="72"
    text-anchor="middle"
    font-family="'Jost','Helvetica Neue',Arial,sans-serif"
    font-size="11" font-weight="300" letter-spacing="10" fill="#C9A96E">THE</text>

  <!-- NAIL ARTISTRY main wordmark -->
  <text x="280" y="112"
    text-anchor="middle"
    font-family="'Jost','Helvetica Neue',Arial,sans-serif"
    font-size="34" font-weight="300" letter-spacing="10" fill="#0D0A07">NAIL ARTISTRY</text>

  <!-- Thin divider below wordmark -->
  <line x1="120" y1="124" x2="440" y2="124" stroke="#C9A96E" stroke-width="0.5" opacity="0.55"/>

  <!-- Tagline -->
  <text x="280" y="145"
    text-anchor="middle"
    font-family="'Jost','Helvetica Neue',Arial,sans-serif"
    font-size="10" font-weight="300" letter-spacing="6" fill="#C9A96E" opacity="0.85">LUXURY NAIL STUDIO  •  EST. MMXXIV</text>

  <!-- ===== BOTTOM CENTER ART DECO ORNAMENT ===== -->
  <line x1="180" y1="170" x2="270" y2="170" stroke="#C9A96E" stroke-width="0.5" opacity="0.4"/>
  <polygon points="280,176 285,170 280,164 275,170" fill="#C9A96E" opacity="0.6"/>
  <line x1="290" y1="170" x2="380" y2="170" stroke="#C9A96E" stroke-width="0.5" opacity="0.4"/>
</svg>
