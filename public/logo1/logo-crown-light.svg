<svg width="300" height="340" viewBox="0 0 300 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,600;1,300&amp;display=swap');</style>
  </defs>

  <rect width="300" height="340" fill="#FAF7F0" rx="0"/>

  <!-- ===== CROWN ===== centered at x=150, top at y=30 -->
  <!-- Crown body (5 prongs, symmetric about x=150) -->
  <path d="M62,112 L62,94 L86,68 L100,90 L118,52 L132,86 L150,42 L168,86 L182,52 L200,90 L214,68 L238,94 L238,112 Z"
    fill="#C9A96E" opacity="0.15"/>
  <path d="M62,112 L62,94 L86,68 L100,90 L118,52 L132,86 L150,42 L168,86 L182,52 L200,90 L214,68 L238,94 L238,112 Z"
    stroke="#C9A96E" stroke-width="1.4" fill="none"/>

  <!-- Crown base band -->
  <rect x="62" y="108" width="176" height="14" rx="2" fill="#C9A96E" opacity="0.18"/>
  <rect x="62" y="108" width="176" height="14" rx="2" stroke="#C9A96E" stroke-width="1.2" fill="none"/>

  <!-- Crown jewels at prong tips -->
  <!-- Center top (ruby/pink) -->
  <circle cx="150" cy="44" r="5.5" fill="#DD2C6C" opacity="0.9"/>
  <circle cx="150" cy="44" r="3"   fill="#FF8AAD" opacity="0.6"/>
  <!-- Inner prong jewels (rose gold diamond) -->
  <polygon points="118,54  121,50  118,46  115,50" fill="#C9A96E"/>
  <polygon points="182,54  185,50  182,46  179,50" fill="#C9A96E"/>
  <!-- Outer prong jewels (small) -->
  <circle cx="86"  cy="70" r="3" fill="#C9A96E" opacity="0.7"/>
  <circle cx="214" cy="70" r="3" fill="#C9A96E" opacity="0.7"/>

  <!-- Small inner dots on crown band -->
  <circle cx="110" cy="115" r="2" fill="#C9A96E" opacity="0.5"/>
  <circle cx="150" cy="115" r="2.5" fill="#C9A96E" opacity="0.6"/>
  <circle cx="190" cy="115" r="2" fill="#C9A96E" opacity="0.5"/>

  <!-- ===== DIVIDER ===== -->
  <line x1="60"  y1="138" x2="240" y2="138" stroke="#C9A96E" stroke-width="0.6" opacity="0.5"/>
  <line x1="60"  y1="141" x2="240" y2="141" stroke="#C9A96E" stroke-width="0.3" opacity="0.3"/>

  <!-- ===== MONOGRAM TNA ===== -->
  <text x="150" y="215"
    text-anchor="middle"
    font-family="'Jost','Helvetica Neue',Arial,sans-serif"
    font-size="72" font-weight="600" letter-spacing="-2"
    fill="#0D0A07">TNA</text>

  <!-- ===== DIVIDER BELOW MONOGRAM ===== -->
  <line x1="60" y1="228" x2="240" y2="228" stroke="#C9A96E" stroke-width="0.6" opacity="0.5"/>

  <!-- ===== BRAND NAME ===== -->
  <text x="150" y="256"
    text-anchor="middle"
    font-family="'Jost','Helvetica Neue',Arial,sans-serif"
    font-size="11.5" font-weight="300" letter-spacing="7.5"
    fill="#0D0A07" opacity="0.85">THE NAIL ARTISTRY</text>

  <!-- ===== EST LINE ===== -->
  <!-- Flanking ornaments -->
  <line x1="60"  y1="276" x2="118" y2="276" stroke="#C9A96E" stroke-width="0.5" opacity="0.5"/>
  <text x="150" y="280"
    text-anchor="middle"
    font-family="'Jost','Helvetica Neue',Arial,sans-serif"
    font-size="9" font-weight="300" letter-spacing="5"
    fill="#C9A96E" opacity="0.85">EST. MMXXIV</text>
  <line x1="182" y1="276" x2="240" y2="276" stroke="#C9A96E" stroke-width="0.5" opacity="0.5"/>

  <!-- Bottom diamond ornament -->
  <polygon points="150,300 155,294 150,288 145,294" fill="#C9A96E" opacity="0.55"/>
</svg>
