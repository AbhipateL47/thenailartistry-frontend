  <!-- Top center diamond + flanking lines -->
  <polygon points="280,28 284,22 280,16 276,22" fill="#D4A853" opacity="0.7"/>
  <line x1="180" y1="28" x2="272" y2="28" stroke="#D4A853" stroke-width="0.5" opacity="0.4"/>
  <line x1="288" y1="28" x2="380" y2="28" stroke="#D4A853" stroke-width="0.5" opacity="0.4"/>

